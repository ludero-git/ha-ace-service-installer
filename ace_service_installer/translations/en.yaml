configuration:
  installer:
    name: Installer
    description: Configure the ACE Service Installer package and installation mode.
    fields:
      url:
        name: Installer Download Link
        description: Direct download link to the ACE Service Installer MSI file.
      mode:
        name: Install Mode
        description: Install silently or show the interactive MSI installer.
  startup:
    name: Startup
    description: Configure automatic actions when the app starts.
    fields:
      install:
        name: Automatic Install
        description: Automatically install the ACE Service Installer when it is not installed.
      launch:
        name: Automatic Launch
        description: Automatically launch the ACE Service Installer when ready.
  display:
    name: Display
    description: Configure how the ACE Service Installer is displayed.
    fields:
      mode:
        name: Display Mode
        description: Show only the application or expose the full desktop and other windows.
      maximize:
        name: Automatic Maximization
        description: Automatically resize and maximize the main ACE Service Installer window.
  logging:
    name: Logging
    description: Configure runtime logging verbosity.
    fields:
      level:
        name: Log Level
        description: Use info normally, debug for additional diagnostics, or trace for verbose Wine tracing.