name: ACE Service Installer
version: "0.1.3"
slug: ace_service_installer
description: Install and run the Alfen ACE Service Installer in Home Assistant
image: "ghcr.io/ludero-git/ha-ace-service-installer"
url: https://github.com/ludero-git/ha-ace-service-installer
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8100
ingress_stream: true
panel_icon: mdi:wrench-cog
panel_title: ACE Service Installer
panel_admin: true
host_network: true
privileged:
  - NET_ADMIN
  - NET_RAW
map:
  - type: app_config
    read_only: false
    path: /config
options:
  installer:
    url: "https://web.archive.org/web/20260822124756/https://api.media.atlassian.com/file/5cc708dd-df74-44e9-8b5c-7f15abd94b05/binary?token=eyJhbGciOiJIUzI1NiJ9..4ZDNu9yeudpDwUMBk8caZewfuq9PxaTjcdqoYRZbkEg&client=77fb1e99-e22f-49eb-9902-2f31050609cd&name=ACE%20Service%20Installer%20v4.3.0_424.msi"
    mode: silent
  startup:
    install: true
    launch: true
  display:
    mode: application
    maximize: true
  logging:
    level: info
schema:
  installer:
    url: url
    mode: "list(silent|interactive)"
  startup:
    install: bool
    launch: bool
  display:
    mode: "list(application|desktop)"
    maximize: bool
  logging:
    level: "list(info|debug|trace)"
stage: experimental